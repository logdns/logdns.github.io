<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找不到这个页面 · logdns</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --bg:#f7f8fc; --ink:#10131a; --muted:#667085; --accent:#3b6ef6; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b0e13; --ink:#edf1f7; --muted:#98a2b3; --accent:#6e93ff; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
           font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
           padding:24px; }
    main { max-width:520px; }
    img { width:48px; height:48px; border-radius:12px; }
    p.code { color:var(--accent); font-weight:700; letter-spacing:.14em; margin:22px 0 10px; font-size:13px; }
    h1 { font-size:34px; letter-spacing:-.03em; margin:0 0 12px; }
    p { color:var(--muted); margin:0 0 24px; }
    a.btn { display:inline-block; padding:10px 18px; border-radius:10px; background:var(--accent); color:#fff;
            text-decoration:none; font-weight:600; font-size:14px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/favicon.svg" alt="logdns">
    <p class="code">404</p>
    <h1>这个页面不在这里。</h1>
    <p>地址可能写错了，或者项目搬了家。首页有全部项目。</p>
    <a class="btn" href="/">回到首页</a>
  </main>
</body>
</html>
